name: Multiplayer E2E (public broker)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # M6-05: darwin full suite 23.95 min; retain setup/platform headroom for CI.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build once for all E2E specs
        run: npm run build
        env:
          VITE_KART_DEBUG: '1'
      - name: Run real-broker E2E
        id: e2e
        # Public broker / NAT failures are advisory, separate from the push build.
        continue-on-error: true
        run: npm run e2e
      - name: Report broker test failure
        if: steps.e2e.outcome == 'failure'
        run: echo '::warning::Multiplayer E2E failed. Inspect the attached console logs and traces.'
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-e2e
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: warn
